    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #356ac3" x="57.6" y="43.2" transform="rotate(-0 57.6 43.2)">ifmain  /  RESEARCH</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17263c" x="57.6" y="93.6" transform="rotate(-0 57.6 93.6)">From local evidence to an image-level score.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #607087" x="57.6" y="136.8" transform="rotate(-0 57.6 136.8)">Inference and distillation  /  The same four-stream architecture across the model family</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #356ac3" x="57.6" y="194.4" transform="rotate(-0 57.6 194.4)">INFERENCE</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17263c" x="169.2" y="279.347188" transform="rotate(-0 169.2 279.347188)">Five RGB crops</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #607087" x="169.2" y="308.759375" transform="rotate(-0 169.2 308.759375)">Corners + center · 128 × 128</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17263c" x="468" y="279.347188" transform="rotate(-0 468 279.347188)">Four-stream detector</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #607087" x="468" y="308.759375" transform="rotate(-0 468 308.759375)">Frozen VAE + trainable head</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17263c" x="777.6" y="279.296406" transform="rotate(-0 777.6 279.296406)">Pool + classify</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #607087" x="777.6" y="308.759375" transform="rotate(-0 777.6 308.759375)">CLS + central 6 × 6 tokens</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17263c" x="1098" y="279.296406" transform="rotate(-0 1098 279.296406)">Image decision</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #607087" x="1098" y="308.759375" transform="rotate(-0 1098 308.759375)">Mean of five logits ≥ threshold</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #607087" x="57.6" y="381.6" transform="rotate(-0 57.6 381.6)">96 × 96 active center; surrounding tokens supply context. Scores are raw logits, not calibrated probabilities.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #198676" x="57.6" y="446.4" transform="rotate(-0 57.6 446.4)">SOFT-TARGET DISTILLATION</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17263c" x="187.2" y="552.947188" transform="rotate(-0 187.2 552.947188)">Shared frozen VAE</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #607087" x="187.2" y="582.359375" transform="rotate(-0 187.2 582.359375)">Identical encoder features</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17263c" x="554.4" y="491.696406" transform="rotate(-0 554.4 491.696406)">Large teacher</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #607087" x="554.4" y="521.159375" transform="rotate(-0 554.4 521.159375)">Frozen detector head</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17263c" x="554.4" y="621.347188" transform="rotate(-0 554.4 621.347188)">Student head</text>
   </g>
   <g id="text_20">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #607087" x="554.4" y="650.759375" transform="rotate(-0 554.4 650.759375)">Medium / Small / Tiny</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17263c" x="1015.2" y="527.696406" transform="rotate(-0 1015.2 527.696406)">Soft targets + supervised learning</text>
   </g>
   <g id="text_22">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #607087" x="1015.2" y="557.159375" transform="rotate(-0 1015.2 557.159375)">50% Bernoulli KL (T = 2) + 50% supervised objective</text>
   </g>
   <g id="text_23">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #607087" x="799.2" y="640.8" transform="rotate(-0 799.2 640.8)">Supervised objective: classification + paired ranking.</text>
   </g>
   <g id="text_24">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #607087" x="57.6" y="705.6" transform="rotate(-0 57.6 705.6)">Teacher and encoder stay frozen. Only the student head is optimized during distillation.</text>
   </g>
  </g>
