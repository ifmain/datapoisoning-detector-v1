   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18273c" x="71.28" y="550.8" transform="rotate(-0 71.28 550.8)">Split position = 100 × ours / (ours + LightShed). Labels show actual scores; bold marks the higher score.</text>
  </g>
  <g id="text_42">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #607087" x="71.28" y="575.424" transform="rotate(-0 71.28 575.424)">Independent test sets and operating points; this is not a shared-benchmark or preference study.</text>
  </g>
  <g id="text_43">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #607087" x="71.28" y="598.104" transform="rotate(-0 71.28 598.104)">Our specificity uses the same 1,240 clean images in every row (1,229 accepted).  ¹ LightShed binary comparator.</text>
  </g>
  <g id="text_44">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #607087" x="71.28" y="621.432" transform="rotate(-0 71.28 621.432)">Source: LightShed, USENIX Security 2025, Table 2. Its separate NightShade LPIPS 0.07 result is 99.98% recall / 100% specificity.</text>
  </g>
